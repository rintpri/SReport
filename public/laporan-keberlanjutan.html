<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan Keberlanjutan ESG — Versi HTML Mandiri (LocalStorage + Excel)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #F8F8F6;
      --surface: #FFFFFF;
      --surface-muted: #F4F4F1;
      --ink: #141816;
      --ink-muted: #57534E;
      --border: #E7E5E4;
      --emerald: #14532D;
      --emerald-hover: #166534;
      --emerald-soft: #ECFDF5;
      --amber: #B45309;
      --amber-soft: #FFFBEB;
      --danger: #B91C1C;
      --danger-soft: #FEF2F2;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 264px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
    }
    .sidebar-head {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    .profile-btn {
      width: 100%;
      text-align: left;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .profile-btn:hover { background: #ECECE8; }
    .profile-label { font-size: 10px; color: var(--ink-muted); font-weight: 600; text-transform: uppercase; }
    .profile-name { font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }

    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .nav-item {
      border: none;
      background: transparent;
      text-align: left;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      color: #44403C;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
    }
    .nav-item:hover { background: var(--surface-muted); color: var(--ink); }
    .nav-item.active { background: var(--emerald); color: #FFFFFF; font-weight: 600; }

    .sidebar-foot {
      padding: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Main Workspace */
    .main-wrap {
      flex: 1;
      margin-left: 264px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .topbar-title { font-size: 13px; font-weight: 600; color: var(--ink); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .year-switch {
      display: inline-flex;
      background: #F1F1EE;
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
    }
    .year-btn {
      border: none;
      background: transparent;
      padding: 5px 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      border-radius: 6px;
      cursor: pointer;
    }
    .year-btn.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

    .content {
      max-width: 1140px;
      width: 100%;
      margin: 0 auto;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn-primary { background: var(--emerald); color: #FFFFFF; }
    .btn-primary:hover { background: var(--emerald-hover); }
    .btn-secondary { background: var(--surface); border-color: #D6D3D1; color: var(--ink); }
    .btn-secondary:hover { background: var(--surface-muted); }
    .btn-soft { background: #F1F1EE; color: var(--ink); }
    .btn-soft:hover { background: #E5E5E0; }
    .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: #FECACA; }
    .btn-sm { padding: 5px 9px; font-size: 11px; }

    /* Typography & Cards */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--emerald);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    h2 {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 4px 0;
    }
    .subtitle { font-size: 13px; color: var(--ink-muted); margin: 6px 0 0 0; max-width: 720px; }

    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .kpi-label { font-size: 11.5px; color: var(--ink-muted); font-weight: 500; }
    .kpi-val {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 600;
      margin: 6px 0 4px 0;
      font-variant-numeric: tabular-nums;
    }
    .kpi-sub { font-size: 11.5px; color: var(--ink-muted); }
    .tone-positive { color: var(--emerald); }
    .tone-warning { color: var(--amber); }

    /* Table */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .table-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th {
      background: #FAFAF8;
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 11px 14px;
      border-bottom: 1px solid #F1F1EE;
      vertical-align: middle;
    }
    tr:hover td { background: #FAFAF9; }
    .num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* Inputs */
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11.5px; font-weight: 600; color: #44403C; margin-bottom: 4px; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #D6D3D1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      background: #FFFFFF;
    }
    .inline-num {
      width: 110px;
      padding: 5px 8px;
      border: 1px solid #D6D3D1;
      border-radius: 6px;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 24, 22, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--surface);
      border-radius: 14px;
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid var(--border);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.16);
    }
    .modal-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: var(--surface);
    }
    .modal-body { padding: 18px 20px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

    .banner {
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 12.5px;
      border: 1px solid;
    }
    .banner-ok { background: var(--emerald-soft); border-color: #A7F3D0; color: var(--emerald); }
    .banner-warn { background: var(--amber-soft); border-color: #FDE68A; color: var(--amber); }

    .mobile-menu-btn { display: none; }

    @media (max-width: 960px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.2s ease; }
      .sidebar.open { transform: translateX(0); }
      .main-wrap { margin-left: 0; }
      .mobile-menu-btn { display: inline-flex; }
      .content { padding: 18px; }
    }

    @media print {
      .sidebar, .topbar, .no-print { display: none !important; }
      .main-wrap { margin-left: 0; }
      body { background: #FFFFFF; }
      .card, .table-wrap { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <div class="brand">SustainaLedger HTML</div>
        <button type="button" class="profile-btn" onclick="openProfileModal()">
          <div>
            <div class="profile-label">Profil Aktif (LocalStorage)</div>
            <div class="profile-name" id="sidebarProfileName">-</div>
          </div>
          <span style="font-size:12px;color:#57534E;">⇄</span>
        </button>
      </div>
      <nav class="nav-list" id="navList"></nav>
      <div class="sidebar-foot">
        <button type="button" class="btn btn-primary" style="width:100%;justify-content:center;" onclick="exportActiveToExcel()">
          Simpan ke Excel (.xlsx)
        </button>
        <label class="btn btn-secondary" style="width:100%;justify-content:center;cursor:pointer;">
          Muat dari Excel (.xlsx)
          <input type="file" accept=".xlsx,.xls" style="display:none;" onchange="handleExcelImport(event)" />

        <button type="button" class="btn btn-soft" style="width:100%;justify-content:center;" onclick="resetAllData()">
          Reset Data Contoh
        </button>
      </div>

    <!-- Main -->
    <div class="main-wrap">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:10px;">
          <button type="button" class="btn btn-secondary btn-sm mobile-menu-btn" onclick="toggleSidebar()">Menu</button>
          <span class="topbar-title" id="topbarSectionTitle">Ringkasan Eksekutif</span>
        </div>
        <div class="topbar-actions">
          <div class="year-switch" id="yearSwitch"></div>
          <button type="button" class="btn btn-secondary btn-sm" onclick="exportActiveToExcel()">Ekspor Excel</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="window.print()">Cetak / PDF</button>
        </div>
      </header>

      <main class="content" id="mainContent"></main>
    </div>
  </div>

  <!-- Dynamic Modal -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal-box">
      <div class="modal-head">
        <strong id="modalTitle" style="font-family:var(--font-serif);font-size:17px;">Form Data</strong>
        <button type="button" class="btn btn-soft btn-sm" onclick="closeModal()">Tutup</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

    function escapeHtml(val) {
      return String(val ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function fmtNum(val, dec = 0) {
      return Number(val || 0).toLocaleString('id-ID', {
        minimumFractionDigits: dec,
        maximumFractionDigits: dec,
      });
    }

    function fmtIDR(val) {
      const n = Number(val || 0);
      if (n >= 1e9) return 'Rp ' + (n / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' M';
      if (n >= 1e6) return 'Rp ' + (n / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' Jt';
      return 'Rp ' + fmtNum(n);
    }

    function uid(prefix) {
      return prefix + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const activeId = localStorage.getItem(ACTIVE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return {
              profiles: parsed,
              activeProfileId: parsed.some((p) => p.id === activeId) ? activeId : parsed[0].id,
            };
          }
        }
      } catch (e) { /* fallback */ }
      const defaultProfiles = [
        { id: 'prof-1', dataset: createInitialDataset('PT Nusantara Lestari Industri Tbk', 'Manufaktur & Material Terpadu', 'Jawa Barat & Kalimantan Timur') },
        { id: 'prof-2', dataset: createInitialDataset('PT Energi Hijau Sentosa', 'Energi Terbarukan & Infrastruktur', 'Jawa Tengah & Sulawesi Selatan') },
      ];
      return { profiles: defaultProfiles, activeProfileId: 'prof-1' };
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.profiles));
        localStorage.setItem(ACTIVE_KEY, state.activeProfileId);
      } catch (e) {
        statusBanner = { tone: 'warn', text: 'Gagal menyimpan ke localStorage browser: ' + e.message };
      }
    }

    function getActiveProfile() {
      return state.profiles.find((p) => p.id === state.activeProfileId) || state.profiles[0];
    }

    function getData() {
      return getActiveProfile().dataset;
    }

    function calcTSIR(s) {
      if (!s || !s.jamKerjaSelamat) return 0;
      const totalCases = (s.medicalTreatment || 0) + (s.restrictedWork || 0) + (s.lti || 0) + (s.fatality || 0);
      return (totalCases * (s.basisPerhitungan || 200000)) / s.jamKerjaSelamat;
    }

    function calcGJ(e) {
      return (Number(e.konsumsiAsli) || 0) * (Number(e.faktorKonversiGJ) || 0);
    }

    function calcEmisi(e) {
      return calcGJ(e) * (Number(e.faktorEmisiTonCO2ePerGJ) || 0);
    }

    function getWfTotals(wf) {
      const rows = wf.jabatan || [];
      return rows.reduce((acc, r) => ({
        total: acc.total + r.lakiLaki + r.perempuan,
        laki: acc.laki + r.lakiLaki,
        perempuan: acc.perempuan + r.perempuan,
        tetap: acc.tetap + r.tetap,
        kontrak: acc.kontrak + r.kontrak,
        lokal: acc.lokal + r.lokal,
        tka: acc.tka + r.tka,
      }), { total: 0, laki: 0, perempuan: 0, tetap: 0, kontrak: 0, lokal: 0, tka: 0 });
    }

    function exportActiveToExcel() {
      const d = getData();
      const sheets = buildSheetArrays(d);
      const safeName = d.company.namaPerusahaan.replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_|_$/g, '') || 'ESG';

      if (window.XLSX) {
        const wb = XLSX.utils.book_new();
        Object.keys(sheets).forEach((name) => {
          const ws = XLSX.utils.aoa_to_sheet(sheets[name]);
          XLSX.utils.book_append_sheet(wb, ws, name);
        });
        XLSX.writeFile(wb, `Laporan_Keberlanjutan_${safeName}.xlsx`);
        notify('ok', `Berhasil mengekspor data localStorage profil "${d.company.namaPerusahaan}" ke Excel (.xlsx 11 sheet).`);
        return;
      }

      // Offline fallback: multi-sheet Excel SpreadsheetML (.xls)
      let xml = '<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>' +
        '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">';
      Object.keys(sheets).forEach((name) => {
        xml += `<Worksheet ss:Name="${escapeHtml(name.slice(0, 31))}"><Table>`;
        sheets[name].forEach((row) => {
          xml += '<Row>';
          row.forEach((cell) => {
            const isNum = typeof cell === 'number' && !isNaN(cell);
            xml += `<Cell><Data ss:Type="${isNum ? 'Number' : 'String'}">${escapeHtml(cell)}</Data></Cell>`;
          });
          xml += '</Row>';
        });
        xml += '</Table></Worksheet>';
      });
      xml += '</Workbook>';

      const blob = new Blob([xml], { type: 'application/vnd.ms-excel' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Laporan_Keberlanjutan_${safeName}.xls`;
      a.click();
      URL.revokeObjectURL(a.href);
      notify('ok', `Berhasil mengekspor data ke Excel multi-sheet offline (.xls).`);
    }

    function handleExcelImport(event) {
      const file = event.target.files[0];
      event.target.value = '';
      if (!file) return;
      if (!window.XLSX) {
        notify('warn', 'Library Excel XLSX belum termuat (membutuhkan koneksi internet saat impor .xlsx).');
        return;
      }
      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          const getRows = (name) => wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '' }) : [];
          const next = JSON.parse(JSON.stringify(getData()));
          const pYear = (v) => ([2023, 2024, 2025].includes(Number(v)) ? Number(v) : 2025);

          const pr = getRows('Profil_Ringkasan');
          if (pr.length > 1) {
            const map = new Map(pr.slice(1).map((r) => [String(r[0]), String(r[1] ?? '')]));
            if (map.get('Nama Perusahaan')) next.company.namaPerusahaan = map.get('Nama Perusahaan');
            if (map.get('Sektor Usaha')) next.company.sektorUsaha = map.get('Sektor Usaha');
            if (map.get('Lokasi Operasional')) next.company.lokasiOperasional = map.get('Lokasi Operasional');
            if (map.get('Standar Acuan')) next.company.standarAcuan = map.get('Standar Acuan');
            if (map.get('Ringkasan Direksi')) next.company.ringkasanDireksi = map.get('Ringkasan Direksi');
            if (map.get('Produksi 2023 (Ton)')) next.company.volumeProduksiTon[2023] = Number(map.get('Produksi 2023 (Ton)')) || next.company.volumeProduksiTon[2023];
            if (map.get('Produksi 2024 (Ton)')) next.company.volumeProduksiTon[2024] = Number(map.get('Produksi 2024 (Ton)')) || next.company.volumeProduksiTon[2024];
            if (map.get('Produksi 2025 (Ton)')) next.company.volumeProduksiTon[2025] = Number(map.get('Produksi 2025 (Ton)')) || next.company.volumeProduksiTon[2025];
          }

          const csr = getRows('01_CSR');
          if (csr.length > 1) {
            next.csrPrograms = csr.slice(1).filter((r) => String(r[2] || '').trim()).map((r, i) => ({
              id: String(r[0] || uid('csr')), year: pYear(r[1]), namaProgram: String(r[2]), pilar: String(r[3] || 'Pendidikan'),
              lokasi: String(r[4] || ''), anggaranRp: Number(r[5]) || 0, realisasiRp: Number(r[6]) || 0,
              penerimaManfaat: Number(r[7]) || 0, satuanPenerima: String(r[8] || 'Orang'), status: String(r[9]) === 'Berjalan' ? 'Berjalan' : 'Selesai',
            }));
          }

          const k3 = getRows('02_K3_TSIR');
          if (k3.length > 1) {
            const idx = k3.findIndex((r) => String(r[0]) === 'Log Insiden ID');
            const sumRows = idx > -1 ? k3.slice(1, idx) : k3.slice(1);
            sumRows.filter((r) => [2023, 2024, 2025].includes(Number(r[0]))).forEach((r) => {
              const y = pYear(r[0]);
              next.k3Summaries[y] = {
                jamKerjaSelamat: Number(r[1]) || 0, jamKerjaZeroAccidentKumulatif: Number(r[2]) || 0,
                jumlahTenagaKerja: Number(r[3]) || 0, basisPerhitungan: Number(r[4]) === 1000000 ? 1000000 : 200000,
                nearMiss: Number(r[5]) || 0, firstAid: Number(r[6]) || 0, medicalTreatment: Number(r[7]) || 0,
                restrictedWork: Number(r[8]) || 0, lti: Number(r[9]) || 0, fatality: Number(r[10]) || 0,
                hariHilang: Number(r[11]) || 0, catatanZeroAccident: String(r[13] || ''),
              };
            });
            if (idx > -1) {
              next.k3Incidents = k3.slice(idx + 1).filter((r) => String(r[2] || '').trim()).map((r) => ({
                id: String(r[0] || uid('inc')), year: pYear(r[1]), tanggal: String(r[2]), kategori: String(r[3] || 'Near Miss'),
                unitKerja: String(r[4] || ''), deskripsi: String(r[5] || ''), hariHilang: Number(r[6]) || 0, tindakanPerbaikan: String(r[7] || ''),
              }));
            }
          }

          const tr = getRows('03_Pelatihan');
          if (tr.length > 1) {
            next.trainings = tr.slice(1).filter((r) => String(r[3] || '').trim()).map((r) => ({
              id: String(r[0] || uid('tr')), year: pYear(r[1]), jabatan: String(r[2] || 'Operator & Teknisi'),
              namaPelatihan: String(r[3]), kategori: String(r[4] || 'Teknis & Operasional'),
              jumlahPeserta: Number(r[5]) || 0, durasiJamPerPeserta: Number(r[6]) || 0, penyelenggara: String(r[8] || ''),
            }));
          }

          const wf = getRows('04_Kinerja_Sosial');
          if (wf.length > 1) {
            const idx = wf.findIndex((r) => String(r[0]) === 'Ringkasan Tahun');
            const jRows = idx > -1 ? wf.slice(1, idx) : wf.slice(1);
            const grouped = { 2023: [], 2024: [], 2025: [] };
            jRows.filter((r) => [2023, 2024, 2025].includes(Number(r[0])) && r[1]).forEach((r) => {
              grouped[pYear(r[0])].push({
                jabatan: String(r[1]), lakiLaki: Number(r[2]) || 0, perempuan: Number(r[3]) || 0,
                tetap: Number(r[4]) || 0, kontrak: Number(r[5]) || 0, lokal: Number(r[6]) || 0, tka: Number(r[7]) || 0,
              });
            });
            YEARS.forEach((y) => { if (grouped[y].length) next.workforce[y].jabatan = grouped[y]; });
            if (idx > -1) {
              wf.slice(idx + 1).filter((r) => [2023, 2024, 2025].includes(Number(r[0]))).forEach((r) => {
                const y = pYear(r[0]);
                next.workforce[y].lokalRing1 = Number(r[2]) || 0;
                next.workforce[y].lokalNasional = Number(r[3]) || 0;
                next.workforce[y].tka = Number(r[4]) || 0;
                next.workforce[y].tingkatTurnoverPersen = Number(r[5]) || 0;
              });
            }
          }

          const en = getRows('05_Energi_GJ');
          if (en.length > 1) {
            next.energyEntries = en.slice(1).filter((r) => String(r[2] || '').trim()).map((r) => ({
              id: String(r[0] || uid('en')), year: pYear(r[1]), sumber: String(r[2]), kategori: String(r[3] || 'Bahan Bakar Fosil'),
              unitAsli: String(r[4] || 'kWh'), konsumsiAsli: Number(r[5]) || 0, faktorKonversiGJ: Number(r[6]) || 0,
              faktorEmisiTonCO2ePerGJ: Number(r[8]) || 0, catatanFaktor: String(r[10] || ''),
            }));
          }

          const env = getRows('06_Lingkungan');
          if (env.length > 1) {
            const idx = env.findIndex((r) => String(r[0]) === 'Log Limbah ID');
            const sRows = idx > -1 ? env.slice(1, idx) : env.slice(1);
            sRows.filter((r) => [2023, 2024, 2025].includes(Number(r[0]))).forEach((r) => {
              const y = pYear(r[0]);
              next.environment[y].air = { airTanahM3: Number(r[1]) || 0, pdamM3: Number(r[2]) || 0, airPermukaanM3: Number(r[3]) || 0, airDaurUlangM3: Number(r[4]) || 0 };
              next.environment[y].emisiScope3TonCO2e = Number(r[7]) || 0;
              next.environment[y].hayati = { luasanKonservasiHa: Number(r[8]) || 0, luasanRehabilitasiHa: Number(r[9]) || 0, luasanRthPabrikHa: Number(r[10]) || 0, jumlahPohonTertanam: Number(r[11]) || 0 };
            });
            if (idx > -1) {
              const gNB = { 2023: [], 2024: [], 2025: [] }, gB3 = { 2023: [], 2024: [], 2025: [] };
              env.slice(idx + 1).filter((r) => String(r[3] || '').trim()).forEach((r) => {
                const y = pYear(r[1]);
                if (String(r[2]) === 'B3') {
                  gB3[y].push({ id: String(r[0] || uid('b3')), jenis: String(r[3]), jumlahTon: Number(r[4]) || 0, kodeLimbah: String(r[5] || '-'), pengelolaBerizin: String(r[6] || ''), statusManifest: String(r[7] || 'Manifest SIRAJA Lengkap') });
                } else {
                  gNB[y].push({ id: String(r[0] || uid('nb3')), jenis: String(r[3]), jumlahTon: Number(r[4]) || 0, metodeKelola: String(r[5] || ''), persentaseDaurUlang: Number(r[6]) || 0 });
                }
              });
              YEARS.forEach((y) => { if (gNB[y].length) next.environment[y].limbahNonB3 = gNB[y]; if (gB3[y].length) next.environment[y].limbahB3 = gB3[y]; });
            }
          }

          const mkt = getRows('07_Pemasaran');
          if (mkt.length > 1) {
            const gDN = { 2023: [], 2024: [], 2025: [] }, gLN = { 2023: [], 2024: [], 2025: [] };
            mkt.slice(1).filter((r) => [2023, 2024, 2025].includes(Number(r[0])) && r[2]).forEach((r) => {
              const y = pYear(r[0]);
              const item = { id: uid('mkt'), wilayah: String(r[2]), segmen: String(r[3] || ''), volumeTon: Number(r[4]) || 0, pendapatanMiliarRp: Number(r[5]) || 0 };
              if (String(r[1]).includes('LN')) gLN[y].push(item); else gDN[y].push(item);
            });
            YEARS.forEach((y) => { if (gDN[y].length || gLN[y].length) { next.marketing[y].dn = gDN[y]; next.marketing[y].ln = gLN[y]; } });
          }

          const sc = getRows('08_Supply_Chain');
          if (sc.length > 1) {
            next.supplyChain = sc.slice(1).filter((r) => String(r[2] || '').trim()).map((r) => ({
              id: String(r[0] || uid('sc')), year: pYear(r[1]), kategoriPemasok: String(r[2]), jenisKomoditas: String(r[3] || ''),
              jumlahPemasok: Number(r[4]) || 0, nilaiPengadaanMiliarRp: Number(r[5]) || 0, persentaseLolosScreeningESG: Number(r[6]) || 0, rataRataTkdnPersen: Number(r[7]) || 0,
            }));
          }

          const cert = getRows('09_Sertifikasi');
          if (cert.length > 1) {
            next.certifications = cert.slice(1).filter((r) => String(r[3] || '').trim()).map((r) => ({
              id: String(r[0] || uid('cert')), year: pYear(r[1]), tipe: String(r[2]) === 'Penghargaan' ? 'Penghargaan' : 'Sertifikasi',
              nama: String(r[3]), nomorSertifikat: String(r[4] || ''), lembagaPenerbit: String(r[5] || ''), ruangLingkup: String(r[6] || ''), masaBerlaku: String(r[7] || ''), status: String(r[8] || 'Aktif'),
            }));
          }

          const aso = getRows('10_Asosiasi');
          if (aso.length > 1) {
            next.associations = aso.slice(1).filter((r) => String(r[3] || '').trim()).map((r) => ({
              id: String(r[0] || uid('aso')), year: pYear(r[1]), singkatan: String(r[2] || ''), namaAsosiasi: String(r[3]),
              tingkat: String(r[4] || 'Nasional'), peran: String(r[5] || 'Anggota Aktif'), tahunBergabung: Number(r[6]) || 2020, bidangFokus: String(r[7] || ''),
            }));
          }

          getActiveProfile().dataset = next;
          saveState();
          notify('ok', `Data dari file Excel "${file.name}" berhasil dimuat dan disimpan ke localStorage.`);
        } catch (err) {
          notify('warn', 'Gagal membaca file Excel: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

          <div class="modal-foot">
            <button type="submit" class="btn btn-primary">Simpan & Aktifkan Profil</button>
          </div>
        </form>
      `);
    }

    function switchProfile(id) {
      state.activeProfileId = id;
      saveState();
      closeModal();
      render();
    }

    function deleteProfile(id) {
      if (state.profiles.length <= 1) return;
      state.profiles = state.profiles.filter((p) => p.id !== id);
      if (state.activeProfileId === id) state.activeProfileId = state.profiles[0].id;
      saveState();
      openProfileModal();
      render();
    }

    function createNewProfile(e) {
      e.preventDefault();
      const nama = document.getElementById('np_nama').value.trim();
      const sektor = document.getElementById('np_sektor').value.trim();
      const lokasi = document.getElementById('np_lokasi').value.trim();
      const newProf = { id: uid('prof'), dataset: createInitialDataset(nama, sektor, lokasi) };
      state.profiles.push(newProf);
      state.activeProfileId = newProf.id;
      saveState();
      closeModal();
      notify('ok', `Profil "${nama}" ditambahkan ke localStorage.`);
    }

      `);
    }
    function saveAso(e, id) {
      e.preventDefault();
      const obj = {
        id: id || uid('aso'), year: selectedYear,
        singkatan: document.getElementById('a_sing').value.trim(),
        tahunBergabung: Number(document.getElementById('a_thn').value) || 2022,
        namaAsosiasi: document.getElementById('a_nam').value.trim(),
        tingkat: document.getElementById('a_ting').value,
        peran: document.getElementById('a_per').value,
        bidangFokus: document.getElementById('a_fok').value.trim(),
      };
      if (id) getData().associations = getData().associations.map((x) => x.id === id ? obj : x);
      else getData().associations.push(obj);
      saveState(); closeModal(); render();
    }
    function delAso(id) { getData().associations = getData().associations.filter((x) => x.id !== id); saveState(); render(); }

    // ==================== RENDER ENGINE ====================
    function renderSection() {

      const yr = selectedYear;

              <button class="btn btn-soft" onclick="openProfileModal()">Ganti Profil Perusahaan</button>
              <button class="btn btn-soft" onclick="openCompanyEditModal()">Edit Identitas Profil</button>

            <div class="card"><div class="kpi-label">TSIR Keselamatan (${yr})</div><div class="kpi-val ${tsir<=0.15?'tone-positive':'tone-warning'}">${tsir.toFixed(2)}</div><div class="kpi-sub">${fmtNum(k3s.jamKerjaZeroAccidentKumulatif)} jam Zero Accident</div></div>

            <div class="card"><div class="kpi-label">Tenaga Kerja (${yr})</div><div class="kpi-val">${fmtNum(wfTot.total)} Org</div><div class="kpi-sub">Pelatihan: ${fmtNum(trHours)} jam · Area Hayati: ${fmtNum(hayatiHa,1)} Ha</div></div>

              ['lingkungan', '06. Lingkungan & Hayati', `${fmtNum(hayatiHa, 1)} Ha`],

        return `
          <div class="section-head">
            <div><div class="eyebrow">06 / PENGELOLAAN LINGKUNGAN</div><h1>Air, Limbah Non-B3 & B3, Emisi & Tanaman Hayati (${yr})</h1></div>
            <button class="btn btn-primary no-print" onclick="openEnvSummaryModal()">Ubah Data Air, Scope 3 & Hayati</button>
          </div>
          <div class="grid-4">
            <div class="card"><div class="kpi-label">Total Air Digunakan</div><div class="kpi-val">${fmtNum(totAir)} m³</div><div class="kpi-sub">Daur ulang: ${fmtNum(ev.air.airDaurUlangM3)} m³</div></div>
            <div class="card"><div class="kpi-label">Limbah Non-B3 / B3</div><div class="kpi-val">${fmtNum(nb3Ton,1)} / ${fmtNum(b3Ton,1)}</div><div class="kpi-sub">Satuan Ton</div></div>
            <div class="card"><div class="kpi-label">Emisi Scope 3</div><div class="kpi-val">${fmtNum(ev.emisiScope3TonCO2e)}</div><div class="kpi-sub">tCO₂e</div></div>
            <div class="card"><div class="kpi-label">Luasan Tanaman Hayati</div><div class="kpi-val tone-positive">${fmtNum(hayatiHa,1)} Ha</div><div class="kpi-sub">${fmtNum(ev.hayati.jumlahPohonTertanam)} pohon tertanam</div></div>
          </div>
          <div class="table-wrap">
            <div class="table-head"><h2>Limbah Non-B3 (${yr})</h2><button class="btn btn-secondary btn-sm no-print" onclick="openWasteModal('Non-B3', null)">+ Tambah Non-B3</button></div>
            <div class="table-scroll">
              <table>
                <thead><tr><th>Jenis Limbah</th><th class="num">Jumlah (Ton)</th><th>Metode Pengelolaan</th><th class="num">Daur Ulang (%)</th><th class="num no-print">Aksi</th></tr></thead>
                <tbody>
                  ${ev.limbahNonB3.map((w) => `<tr><td><strong>${escapeHtml(w.jenis)}</strong></td><td class="num">${fmtNum(w.jumlahTon,1)}</td><td>${escapeHtml(w.metodeKelola)}</td><td class="num">${w.persentaseDaurUlang}%</td><td class="num no-print"><button class="btn btn-soft btn-sm" onclick="openWasteModal('Non-B3','${w.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="delWaste('Non-B3','${w.id}')">Hapus</button></td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
          <div class="table-wrap">
            <div class="table-head"><h2>Limbah B3 (${yr})</h2><button class="btn btn-secondary btn-sm no-print" onclick="openWasteModal('B3', null)">+ Tambah B3</button></div>
            <div class="table-scroll">
              <table>
                <thead><tr><th>Jenis Limbah B3</th><th>Kode</th><th class="num">Jumlah (Ton)</th><th>Pengelola Berizin</th><th>Status Manifest</th><th class="num no-print">Aksi</th></tr></thead>
                <tbody>
                  ${ev.limbahB3.map((w) => `<tr><td><strong>${escapeHtml(w.jenis)}</strong></td><td class="mono">${escapeHtml(w.kodeLimbah)}</td><td class="num">${fmtNum(w.jumlahTon,1)}</td><td>${escapeHtml(w.pengelolaBerizin)}</td><td>${escapeHtml(w.statusManifest)}</td><td class="num no-print"><button class="btn btn-soft btn-sm" onclick="openWasteModal('B3','${w.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="delWaste('B3','${w.id}')">Hapus</button></td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      if (activeSection === 'pemasaran') {
        const mkt = d.marketing[yr];
        const dnRev = mkt.dn.reduce((a, b) => a + b.pendapatanMiliarRp, 0);
        const lnRev = mkt.ln.reduce((a, b) => a + b.pendapatanMiliarRp, 0);
        return `
          <div class="section-head">
            <div><div class="eyebrow">07 / PEMASARAN PRODUK</div><h1>Distribusi Pasar Dalam Negeri (DN) & Luar Negeri (LN) (${yr})</h1></div>
            <div style="display:flex;gap:8px;" class="no-print">
              <button class="btn btn-secondary" onclick="openMarketModal('DN', null)">+ Tambah Pasar DN</button>
              <button class="btn btn-primary" onclick="openMarketModal('LN', null)">+ Tambah Pasar LN</button>
            </div>
          </div>
          <div class="grid-3">
            <div class="card"><div class="kpi-label">Pendapatan Domestik (DN)</div><div class="kpi-val tone-positive">Rp ${fmtNum(dnRev)} M</div></div>
            <div class="card"><div class="kpi-label">Pendapatan Ekspor (LN)</div><div class="kpi-val">Rp ${fmtNum(lnRev)} M</div></div>
            <div class="card"><div class="kpi-label">Kepuasan / Kepatuhan Label</div><div class="kpi-val">${mkt.indeksKepuasan}% / ${mkt.kepatuhanLabel}%</div></div>
          </div>
          <div class="grid-2">
            <div class="table-wrap">
              <div class="table-head"><h2>Pasar Dalam Negeri (DN)</h2></div>
              <div class="table-scroll">
                <table>
                  <thead><tr><th>Wilayah</th><th>Segmen</th><th class="num">Ton</th><th class="num">Rp M</th><th class="num no-print">Aksi</th></tr></thead>
                  <tbody>${mkt.dn.map((m) => `<tr><td><strong>${escapeHtml(m.wilayah)}</strong></td><td>${escapeHtml(m.segmen)}</td><td class="num">${fmtNum(m.volumeTon)}</td><td class="num">${fmtNum(m.pendapatanMiliarRp)}</td><td class="num no-print"><button class="btn btn-soft btn-sm" onclick="openMarketModal('DN','${m.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="delMarket('DN','${m.id}')">Hapus</button></td></tr>`).join('')}</tbody>
                </table>
              </div>
            </div>
            <div class="table-wrap">
              <div class="table-head"><h2>Pasar Luar Negeri (LN)</h2></div>
              <div class="table-scroll">
                <table>
                  <thead><tr><th>Negara</th><th>Segmen</th><th class="num">Ton</th><th class="num">Rp M</th><th class="num no-print">Aksi</th></tr></thead>
                  <tbody>${mkt.ln.map((m) => `<tr><td><strong>${escapeHtml(m.wilayah)}</strong></td><td>${escapeHtml(m.segmen)}</td><td class="num">${fmtNum(m.volumeTon)}</td><td class="num">${fmtNum(m.pendapatanMiliarRp)}</td><td class="num no-print"><button class="btn btn-soft btn-sm" onclick="openMarketModal('LN','${m.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="delMarket('LN','${m.id}')">Hapus</button></td></tr>`).join('')}</tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }

      if (activeSection === 'supply') {
        const list = d.supplyChain.filter((s) => s.year === yr);
        const totSup = list.reduce((a, b) => a + b.jumlahPemasok, 0);
        const totVal = list.reduce((a, b) => a + b.nilaiPengadaanMiliarRp, 0);
        return `
          <div class="section-head">
            <div><div class="eyebrow">08 / RANTAI PASOK (SUPPLY CHAIN)</div><h1>Jumlah Pemasok & Besaran Nilai Pengadaan (${yr})</h1></div>
            <button class="btn btn-primary no-print" onclick="openScModal(null)">+ Tambah Pemasok</button>
          </div>
          <div class="grid-3">
            <div class="card"><div class="kpi-label">Total Pemasok Terdaftar</div><div class="kpi-val">${fmtNum(totSup)}</div></div>
            <div class="card"><div class="kpi-label">Total Nilai Pengadaan</div><div class="kpi-val tone-positive">Rp ${fmtNum(totVal)} M</div></div>
            <div class="card"><div class="kpi-label">Kategori Rantai Pasok</div><div class="kpi-val">${list.length}</div></div>
          </div>
          <div class="table-wrap">
            <div class="table-scroll">
              <table>
                <thead><tr><th>Kategori Pemasok</th><th>Komoditas</th><th class="num">Pemasok</th><th class="num">Nilai (Rp M)</th><th class="num">ESG (%)</th><th class="num">TKDN (%)</th><th class="num no-print">Aksi</th></tr></thead>
                <tbody>
                  ${list.map((s) => `<tr><td><strong>${escapeHtml(s.kategoriPemasok)}</strong></td><td>${escapeHtml(s.jenisKomoditas)}</td><td class="num">${fmtNum(s.jumlahPemasok)}</td><td class="num tone-positive"><strong>${fmtNum(s.nilaiPengadaanMiliarRp)}</strong></td><td class="num">${s.persentaseLolosScreeningESG}%</td><td class="num">${s.rataRataTkdnPersen}%</td><td class="num no-print"><button class="btn btn-soft btn-sm" onclick="openScModal('${s.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="delSc('${s.id}')">Hapus</button></td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      if (activeSection === 'sertifikasi') {
        return `
          <div class="section-head">
            <div><div class="eyebrow">09 / PENGHARGAAN & SERTIFIKASI</div><h1>Sertifikasi ISO, SMK3, PROPER & Penghargaan</h1></div>
            <button class="btn btn-primary no-print" onclick="openCertModal(null)">+ Tambah Sertifikasi / Award</button>
          </div>
          <div class="table-wrap">
            <div class="table-scroll">
              <table>
                <thead><tr><th>Tahun</th><th>Tipe</th><th>Nama Sertifikasi / Penghargaan</th><th>Nomor</th><th>Lembaga</th><th>Masa Berlaku</th><th>Status</th><th class="num no-print">Aksi</th></tr></thead>
                <tbody>
                  ${d.certifications.map((c) => `<tr><td class="mono">${c.year}</td><td>${escapeHtml(c.tipe)}</td><td><strong>${escapeHtml(c.nama)}</strong></td><td class="mono">${escapeHtml(c.nomorSertifikat)}</td><td>${escapeHtml(c.lembagaPenerbit)}</td><td>${escapeHtml(c.masaBerlaku)}</td><td>${escapeHtml(c.status)}</td><td class="num no-print"><button class="btn btn-soft btn-sm" onclick="openCertModal('${c.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="delCert('${c.id}')">Hapus</button></td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      if (activeSection === 'asosiasi') {
        return `
          <div class="section-head">
            <div><div class="eyebrow">10 / KEANGGOTAAN ASOSIASI</div><h1>Partisipasi Organisasi Industri & Keberlanjutan</h1></div>
            <button class="btn btn-primary no-print" onclick="openAsoModal(null)">+ Tambah Asosiasi</button>
          </div>
          <div class="table-wrap">
            <div class="table-scroll">
              <table>
                <thead><tr><th>Singkatan</th><th>Nama Asosiasi</th><th>Tingkat</th><th>Peran</th><th class="num">Sejak</th><th>Bidang Fokus</th><th class="num no-print">Aksi</th></tr></thead>
                <tbody>
                  ${d.associations.map((a) => `<tr><td><strong>${escapeHtml(a.singkatan)}</strong></td><td>${escapeHtml(a.namaAsosiasi)}</td><td>${escapeHtml(a.tingkat)}</td><td>${escapeHtml(a.peran)}</td><td class="num">${a.tahunBergabung}</td><td>${escapeHtml(a.bidangFokus)}</td><td class="num no-print"><button class="btn btn-soft btn-sm" onclick="openAsoModal('${a.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="delAso('${a.id}')">Hapus</button></td></tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      // 11. LocalStorage & Excel
      const bytes = new Blob([localStorage.getItem(STORAGE_KEY) || '']).size;
      return `
        <div class="section-head">
          <div><div class="eyebrow">PENYIMPANAN LOKAL & EXCEL</div><h1>Penyimpanan LocalStorage ke Excel (.xlsx Multi-Sheet)</h1><p class="subtitle">Seluruh data dari 10 pilar dan profil perusahaan tersimpan otomatis di localStorage browser, serta dapat diekspor maupun dimuat kembali menggunakan file Excel (.xlsx).</p></div>
        </div>
        <div class="grid-3">
          <div class="card"><div class="kpi-label">Profil Tersimpan</div><div class="kpi-val">${state.profiles.length} Profil</div></div>
          <div class="card"><div class="kpi-label">Ukuran LocalStorage</div><div class="kpi-val">${(bytes / 1024).toFixed(1)} KB</div></div>
          <div class="card"><div class="kpi-label">Format Workbook Excel</div><div class="kpi-val tone-positive">11 Tab Sheet</div></div>
        </div>
        <div class="card">
          <h2>Ekspor & Impor Workbook Excel (.xlsx)</h2>
          <p class="subtitle" style="margin-bottom:14px;">File Excel berisi 11 tab terstruktur: Profil_Ringkasan, 01_CSR, 02_K3_TSIR, 03_Pelatihan, 04_Kinerja_Sosial, 05_Energi_GJ, 06_Lingkungan, 07_Pemasaran, 08_Supply_Chain, 09_Sertifikasi, dan 10_Asosiasi.</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="exportActiveToExcel()">Simpan Data Profil Aktif ke Excel (.xlsx)</button>
            <label class="btn btn-secondary" style="cursor:pointer;">Muat File Excel (.xlsx) ke LocalStorage<input type="file" accept=".xlsx,.xls" style="display:none;" onchange="handleExcelImport(event)" /></label>
          </div>
        </div>
      `;
    }

    function render() {
      const d = getData();
      document.getElementById('sidebarProfileName').textContent = d.company.namaPerusahaan;
      const activeNav = NAV_ITEMS.find((n) => n.id === activeSection) || NAV_ITEMS[0];
      document.getElementById('topbarSectionTitle').textContent = `${d.company.namaPerusahaan} / ${activeNav.label}`;

      document.getElementById('navList').innerHTML = NAV_ITEMS.map((item) => `
        <button type="button" class="nav-item ${item.id === activeSection ? 'active' : ''}" onclick="setSection('${item.id}')">
          <span>${escapeHtml(item.label)}</span>
        </button>
      `).join('');

      document.getElementById('yearSwitch').innerHTML = YEARS.map((y) => `
        <button type="button" class="year-btn ${y === selectedYear ? 'active' : ''}" onclick="setYear(${y})">${y}</button>
      `).join('');

      const bannerHtml = statusBanner
        ? `<div class="banner ${statusBanner.tone === 'ok' ? 'banner-ok' : 'banner-warn'}">${escapeHtml(statusBanner.text)}</div>`
        : '';

      document.getElementById('mainContent').innerHTML = bannerHtml + renderSection();
      statusBanner = null;
    }

    render();
  </script>
</body>
</html>
